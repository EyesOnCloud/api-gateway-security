services:

  # ── POSTGRESQL DATABASE FOR KONG ─────────────────────────────
  kong-database:
    image: postgres:15-alpine
    container_name: kong-database
    networks:
      - kong-net
    environment:
      POSTGRES_USER:     kong
      POSTGRES_PASSWORD: kongpass
      POSTGRES_DB:       kong
    volumes:
      - kong-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kong"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── KONG DATABASE MIGRATION (runs once, then exits) ──────────
  kong-migration:
    image: kong:3.6
    container_name: kong-migration
    networks:
      - kong-net
    environment:
      KONG_DATABASE:     postgres
      KONG_PG_HOST:      kong-database
      KONG_PG_PORT:      5432
      KONG_PG_USER:      kong
      KONG_PG_PASSWORD:  kongpass
      KONG_PG_DATABASE:  kong
    command: kong migrations bootstrap
    depends_on:
      kong-database:
        condition: service_healthy
    restart: on-failure

  # ── KONG GATEWAY ─────────────────────────────────────────────
  kong:
    image: kong:3.6
    container_name: kong
    networks:
      - kong-net
    environment:
      KONG_DATABASE:          postgres
      KONG_PG_HOST:           kong-database
      KONG_PG_PORT:           5432
      KONG_PG_USER:           kong
      KONG_PG_PASSWORD:       kongpass
      KONG_PG_DATABASE:       kong
      KONG_PROXY_LISTEN:      0.0.0.0:8000
      KONG_ADMIN_LISTEN:      0.0.0.0:8001
      KONG_PROXY_ACCESS_LOG:  /dev/stdout
      KONG_ADMIN_ACCESS_LOG:  /dev/stdout
      KONG_PROXY_ERROR_LOG:   /dev/stderr
      KONG_ADMIN_ERROR_LOG:   /dev/stderr
    ports:
      - "8000:8000"   # Kong proxy — client traffic goes here
      - "8001:8001"   # Kong Admin API — configuration goes here
    depends_on:
      kong-database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # ── BACKEND SERVICE 1 — EMPLOYEE API ─────────────────────────
  service1:
    build: ./service1
    container_name: employee-api
    networks:
      - kong-net
    # Port 5001 exposed to host can test DIRECT access
    # This demonstrates the bypass problem in Step 10
    ports:
      - "5001:5001"

  # ── BACKEND SERVICE 2 — PROJECTS API ─────────────────────────
  service2:
    build: ./service2
    container_name: projects-api
    networks:
      - kong-net
    # Port 5002 exposed to host can test DIRECT access
    ports:
      - "5002:5002"

volumes:
  kong-db-data:
  
networks:
  kong-net:
    driver: bridge
